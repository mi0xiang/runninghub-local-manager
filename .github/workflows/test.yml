name: Offline tests
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media test tools
        run: choco install ffmpeg --yes --no-progress
      - name: Run offline tests with isolated configuration
        shell: pwsh
        env:
          RUNNINGHUB_CONFIG_FILE: ${{ runner.temp }}/manager-test-config.json
          RUNNINGHUB_API_KEY: ''
          PYTHONIOENCODING: utf-8
        run: |
          $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          $ffprobe = (Get-Command ffprobe -ErrorAction Stop).Source
          @{
            schema_version = 1
            data_dir = (Join-Path $env:RUNNER_TEMP 'manager-test-data')
            python = (Get-Command python -ErrorAction Stop).Source
            ffmpeg = $ffmpeg
            ffprobe = $ffprobe
          } | ConvertTo-Json | Set-Content -LiteralPath $env:RUNNINGHUB_CONFIG_FILE -Encoding utf8
          & $ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg is not available' }
          & $ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe is not available' }
          python -m unittest discover -s tests -v
          exit $LASTEXITCODE
